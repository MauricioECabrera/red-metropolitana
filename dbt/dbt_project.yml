name: "red_metropolitana"
version: "1.0.0"
config-version: 2

profile: "red_metropolitana"

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  red_metropolitana:
    bronze:
      +schema: bronze
      +materialized: view
    silver:
      +schema: silver
      +materialized: table
    gold:
      +schema: gold
      +materialized: table
    features:
      +schema: features
      +materialized: table

seeds:
  red_metropolitana:
    +schema: seeds

snapshots:
  red_metropolitana:
    +target_schema: silver