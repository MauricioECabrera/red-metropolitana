version: 2

models:
  - name: dim_fecha
    description: Calendario de 2026-01-01 a 2027-12-31. Rango amplio para que las fechas fuera de periodo lleguen a cuarentena por regla de calidad y no por falta de llave. Dueno del dominio tiempo, rol A.
    columns:
      - name: fecha_key
        description: Llave entera en formato AAAAMMDD.
        tests: [unique, not_null]
      - name: fecha
        description: Fecha calendario en hora local de Guatemala.
        tests: [unique, not_null]
      - name: nombre_mes
        description: Nombre del mes en español.
      - name: dia_semana_num
        description: Dia de la semana ISO, 1 lunes a 7 domingo.
      - name: nombre_dia
        description: Nombre del dia en español.
      - name: semana_iso
        description: Numero de semana ISO del año.
      - name: es_dia_habil
        description: Verdadero de lunes a viernes. Definicion oficial en bitacora D-008.
        tests: [not_null]
      - name: es_fin_de_semana
        description: Verdadero sabado y domingo.

  - name: dim_hora
    description: Una fila por hora del dia. La hora pico efectiva de un abordaje se calcula en la tabla de hechos como es_franja_pico y es_dia_habil, segun bitacora D-008.
    columns:
      - name: hora_key
        description: Hora del dia de 0 a 23, hora local.
        tests: [unique, not_null]
      - name: hora_etiqueta
        description: Hora en formato HH:00 para el tablero.
      - name: franja_horaria
        description: Pico mañana 06-08, Pico tarde 16-18, Valle 09-15, Extremo el resto.
        tests: [not_null]
      - name: es_franja_pico
        description: Verdadero en las franjas pico, sin considerar el dia.
        tests: [not_null]

  - name: dim_modo
    description: Los cuatro modos de transporte integrados en la red. Dueno del dominio modo, rol A.
    columns:
      - name: modo_key
        description: Llave entera del modo.
        tests: [unique, not_null]
      - name: modo_codigo
        description: Codigo corto TM, TU, MR o AM.
        tests: [unique, not_null]
      - name: modo_nombre
        description: Nombre del sistema.
      - name: unidad_registro
        description: Lo que representa una fila en el archivo de origen, abordaje o trayecto.
      - name: formato_origen
        description: Formato del archivo entregado por el operador.

  - name: map_zona_alias
    description: Tabla de resolucion de zona. Una fila por texto de zona normalizado. Todo modelo Silver que resuelva una zona hace join contra esta tabla usando upper(trim(columna)) = alias_normalizado. Nunca contra el seed directamente, porque el seed tiene varias variantes crudas por alias normalizado.
    columns:
      - name: alias_normalizado
        description: Texto de zona en mayusculas y sin espacios extremos.
        tests: [unique, not_null]
      - name: zona_key
        description: Zona canonica a la que resuelve.
        tests: [not_null]

  - name: dim_estacion_parada
    description: Todos los puntos de abordaje de los cuatro operadores con su zona conformada. Se construye con el lote mas reciente de cada catalogo en Bronze. Dueno del dominio estacion, rol A.
    columns:
      - name: estacion_key
        description: Llave compuesta modo_codigo dos puntos codigo_origen. Ejemplos TM:TM-L1-01, TU:R-101-1, MR:12, AM:AM11.
        tests: [unique, not_null]
      - name: modo_key
        description: Llave del modo al que pertenece el punto.
        tests: [not_null]
      - name: modo_codigo
        description: Codigo corto del modo.
      - name: codigo_origen
        description: Codigo del punto tal como lo entrega el operador. Es la llave con la que los archivos de operacion hacen referencia al punto.
        tests: [not_null]
      - name: nombre_punto
        description: Nombre de la estacion, parada o torre segun el operador.
      - name: linea_ruta
        description: Linea de Transmetro, ruta de Transurbano, eje de Aerometro, o MetroRiel.
      - name: zona_key
        description: Zona conformada, resuelta mediante map_zona_alias. Si un catalogo trae una zona desconocida este test falla.
        tests: [not_null]
      - name: zona_origen
        description: Texto de zona tal como llego del catalogo del operador.
      - name: latitud
        description: Solo disponible para Transmetro.
      - name: longitud
        description: Solo disponible para Transmetro.
      - name: km_trazado
        description: Distancia en kilometros desde el origen del trazado. Solo MetroRiel.
      - name: lote_origen
        description: lote_id del archivo Bronze del que proviene la fila. Permite rastrear hasta el archivo crudo.

  - name: dim_zona
    description: Dimension conformada de zona con indicadores de cobertura calculados desde dim_estacion_parada. Dueno del dominio zona, rol A.
    columns:
      - name: zona_key
        description: Llave estable de la zona.
        tests: [unique, not_null]
      - name: zona_nombre
        description: Nombre canonico mostrado en el tablero.
        tests: [not_null]
      - name: tipo_division
        description: zona_capitalina o municipio.
      - name: municipio
        description: Municipio al que pertenece la division.
      - name: puntos_de_abordaje
        description: Cantidad de estaciones, paradas y torres de cualquier modo ubicadas en la zona.
        tests: [not_null]
      - name: modos_con_servicio
        description: Cantidad de modos distintos con al menos un punto de abordaje en la zona.
        tests: [not_null]
      - name: modos_lista
        description: Codigos de los modos con servicio, o Sin servicio.
      - name: tiene_servicio
        description: Verdadero si al menos un modo tiene un punto de abordaje en la zona.
        tests: [not_null]

  - name: dim_persona
    description: Una fila por persona conocida por la red, desde los abordajes de las fuentes integradas y el padron. Atributos del padron tomados de la version vigente del SCD Tipo 2. Dueno del dominio persona, rol A.
    columns:
      - name: persona_key
        description: Identidad unificada segun bitacora D-002.
        tests: [unique, not_null]
      - name: tipo_identidad
        description: vinculada o solo_aerometro.
        tests: [not_null]
      - name: estado_padron
        description: ACTIVA, INACTIVA o SIN_REGISTRO.
        tests: [not_null]