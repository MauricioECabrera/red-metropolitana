version: 2

models:
  - name: poblacion
    description: "Tabla base de poblacion y etiqueta calculada por unidad_id y fecha_corte."
  - name: features_corte
    description: "Tabla de features por unidad y corte para entrenamiento de modelos."
    columns:
      - name: unidad_id
        tests:
          - not_null
      - name: fecha_corte
        tests:
          - not_null